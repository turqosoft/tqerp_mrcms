[project]
name = "tqerp_mrcms"
authors = [
    { name = "Turqosoft Solutions Pvt. Ltd.", email = "turqosoft@gmail.com"}
]
description = "MRCMS Application"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.frappe.testing.function_type_validation]
max_module_depth = 0

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
